<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AutoPageArchiver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>AutoPageArchiver</h1>
    <div class="status">
      <span id="statusText">未启动</span>
    </div>
    <div class="controls">
      <button id="startBtn" class="btn">开始归档</button>
      <button id="stopBtn" class="btn" disabled>停止归档</button>
    </div>
    <div class="stats">
      <h2>归档统计</h2>
      <p>已归档页面: <span id="archivedCount">0</span></p>
      <div id="urlList" class="url-list"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
